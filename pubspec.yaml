name: my_first_app
description: "A new Flutter project for TUTR app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^1.1.0
  intl: ^0.19.0
  file_picker: ^10.3.10
  dotted_border: ^2.1.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.6
  ffmpeg_kit_flutter_new: ^4.6.0
  http: ^1.1.0
  http_parser: ^4.0.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^3.0.3
  stomp_dart_client: ^3.0.1
  url_launcher: ^6.2.5
  open_filex: ^4.4.0


  just_audio: ^0.9.0
  flutter_sound: ^9.2.13
  permission_handler: ^11.0.1
  path_provider: ^2.1.1

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  app_badge_plus: ^1.2.0

  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon1.png"
  min_sdk_android: 21